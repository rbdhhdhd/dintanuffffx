<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дінтану — 450 сұрақтық квиз</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e2e0d8;--ac:#1f6f5c;--acx:#fff;--ok:#1e8a4c;--okbg:#e4f5ea;--no:#c0392b;--nobg:#fbe9e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141513;--card:#1e201d;--tx:#ececE6;--mut:#9a9a92;--bd:#33362f;--ac:#4cb39a;--acx:#0c1f1a;--ok:#5fd08a;--okbg:#17301f;--no:#ee7b6e;--nobg:#3a1c18}}
:root[data-theme="dark"]{--bg:#141513;--card:#1e201d;--tx:#ececE6;--mut:#9a9a92;--bd:#33362f;--ac:#4cb39a;--acx:#0c1f1a;--ok:#5fd08a;--okbg:#17301f;--no:#ee7b6e;--nobg:#3a1c18}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
.menu button{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.menu button:hover{border-color:var(--ac)}
.menu b{display:block;font-size:1.02rem}
.menu span{color:var(--mut);font-size:.88rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt .l{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:.8rem;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default;color:inherit}
.primary{background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.ghost{background:transparent;border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.big{font-size:2.6rem;font-weight:700;margin:4px 0}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.93rem}
.rev .a{color:var(--ok)}.rev .w{color:var(--no)}
.hide{display:none}
.tt{background:none;border:1px solid var(--bd);border-radius:10px;padding:4px 10px;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div id="menu">
    <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
      <div><h1>Дінтану квизі</h1><p class="sub">450 сұрақ · сұрақтар мен жауаптар әр жолы араласады</p></div>
      <button class="tt" id="theme" type="button">Тақырып</button>
    </div>
    <div class="menu" id="menuBtns"></div>
  </div>
  <div id="quiz" class="hide">
    <div class="top"><span id="pos"></span><span id="score"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="card"><p class="q" id="qtext"></p><div id="opts"></div>
      <div class="row"><button class="primary hide" id="next" type="button">Келесі</button><button class="ghost" id="finish" type="button">Аяқтау</button><button class="ghost" id="tomenu" type="button">Мәзір</button></div>
    </div>
  </div>
  <div id="result" class="hide"></div>
</div>
<script>
const DATA=[{"q": "Ислам дінінің құран Кәрімнен кейінгі екінші орындағы қайнар көзі", "o": ["Хадис", "Моисеидің бес кітабы (Тора)", "Талмуд", "трипитака", "Инжіл"]}, {"q": "Қазақстандағы дін саласын реттейтін негізгі заң қалай аталады?", "o": ["Қазақстан Республикасының «Діни қызмет және діни бірлестіктер туралы» заңы (2011 жылғы 11 қазан).", "Қазақстан Республикасының «Діни қызмет  туралы» заңы (2011 жылғы 11 қазан).", "Қазақстан Республикасының «Діни бірлестіктер туралы» заңы (2011 жылғы 11 қазан).", "Қазақстан Республикасының «Дін туралы» заңы (2011 жылғы 11 қазан).", "Қазақстан Республикасының «Бірлестіктер туралы» заңы (2011 жылғы 11 қазан)."]}, {"q": "«Діни қызмет және діни бірлестіктер туралы» ҚР Заңына сәйкес миссионерлік қызметті жүзеге асыру үшін қандай талаптардың жиынтығы міндетті болып табылады?", "o": ["Уәкілетті органда тіркеуден өту, арнайы үлгідегі куәлік алу және пайдаланылатын діни материалдарды сараптамадан өткізу", "Тек қана жеке куәліктің болуы жеткілікті", "Кез келген заңды тұлғаның кепілдігі мен өтініші", "табыну, сиыну", "дәстүрге сену"]}, {"q": "Қазақстан заңнамасына сәйкес кәмелетке толмағандардың діни іс-шараларға қатысуына қатысты қандай құқықтық механизм қолданылады?", "o": ["Ата-анасының біреуінің немесе заңды өкілдің рұқсатынсыз діни іс-шараларға қатыса алмайды", "Кәмелетке толмағандар еркін түрде кез келген діни жиналысқа қатыса алады", "Тек діни оқу орындары өткізетін іс-шараларға шектеусіз қатыса алады", "Тек жергілікті атқарушы орган рұқсат берген жағдайда ғана қатысуға құқылы", "Тек қана жеке куәліктің болуы жеткілікті"]}, {"q": "Секта ұғымына қай анықтама ең дәл келеді?", "o": ["Дәстүрлі діннен бөлініп шыққан, өзіндік ұстанымдары бар топ", "табыну, сиыну", "дәстүрге сену", "діни сана", "сиыну"]}, {"q": "Қазақстанда діни қызметті реттейтін негізгі заң қай жылы қабылданды?", "o": ["2011", "2001", "2010", "2012", "2020"]}, {"q": "Қазақстанда тіркелмеген діни ұйымдардың қызметі қандай?", "o": ["Заңмен шектелген немесе тыйым салынған", "әлемдік тәртіпке кереғар келетін мақсаттық әрекетті терістеу", "әр нәрсенің шегінен асып кетпеу", "\"тәнді коректендіру\", қатаң диета сақтау", "анимистік нанымдарды қабылдау, Аспанға табыну"]}, {"q": "Деструктивті діни ағымның негізгі қаупі:", "o": ["Адамның еркіндігін шектеу, зорлыққа итермелеу", "табыну, сиыну", "дәстүрге сену", "діни сана", "сиыну"]}, {"q": "Цифрлық миссионерліктің қауіпті түрі:", "o": ["Таргеттелген жарнама мен анонимді аккаунттар арқылы үгіт жүргізу", "әлемдік тәртіпке кереғар келетін мақсаттық әрекетті терістеу", "әр нәрсенің шегінен асып кетпеу", "\"тәнді коректендіру\", қатаң диета сақтау", "анимистік нанымдарды қабылдау, Аспанға табыну"]}, {"q": "Жастардың радикал ағымға тартылуындағы психологиялық фактор:", "o": ["Әлеуметтік әділетсіздік пен өз орнын таба алмау", "табыну, сиыну", "дәстүрге сену", "діни сана", "сиыну"]}, {"q": "Жаңа діни қозғалыстарды зерттеудің мәдени-антропологиялық тәсілі:", "o": ["Ритуалдары мен символдарын мәдени тұрғыдан түсіндіру", "Тек заңбұзушылықтарын анықтау", "ұрлық жасауға", "ер адамның көзіне тіке қарауға", "адамның атын атауға"]}, {"q": "Жаңа діни қозғалыстардың негізгі сипаттарының бірі:", "o": ["Дәстүрлі діндерден бөлек, тың ілімге негізделуі", "әрекет - қимыл жолы", "құдайға сүйіспеншілік пен махаббат жолы", "адамның өз тәнін шеңгеріп, билей алу жолы", "қайрымдылық жолы"]}, {"q": "\"Культ\" терминінің дәлме-дәл баламасы", "o": ["күтім, құрметтеу", "табыну, сиыну", "дәстүрге сену", "діни сана", "сиыну"]}, {"q": "\"Магия, ғылым және дін\" деген еңбектің авторы, ағылшын этнографы", "o": ["Б.Малиновский", "В.Шмидт", "Ф.Бэкон", "К.Юнг", "Ф.Гегель"]}, {"q": "Индуизм дініндегі аса қатерлі құдай Шиваның әйелі, бақытсыздықтың алдын алушы", "o": ["кали", "вишну", "рама", "тримурти", "ұмай"]}, {"q": "Тарихи тұрғыдан қалыптасқан индуимзнің басты екі негізгі бағыты", "o": ["вишнуизм мен шиваизм", "вишнуизм мен брахманизм", "шиваизм мен бархманизм", "шиваизм мен кришнаизм", "кришнаизм мен вишнуизм"]}, {"q": "Үндіст const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let S=null;
function show(id){['menu','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0)}
function menu(){
  const saved=store.get('dq_state'),wrong=store.get('dq_wrong')||[];
  const items=[];
  if(saved&&saved.pos<saved.order.length)items.push(['Жалғастыру','Тоқтаған жерден: '+saved.pos+' / '+saved.order.length,()=>{S=saved;S.answered=false;S.miss=S.miss||[];S.right=S.right||0;render();show('quiz')}]);
  items.push(['Барлық 450 сұрақ','Бәрін араластырып өту',()=>start(DATA.map((_,i)=>i))]);
  [[1,0,100],[2,100,200],[3,200,300],[4,300,450]].forEach(([n,a,b])=>items.push([n+'-бөлім: '+(a+1)+'–'+b+' сұрақ',(b-a)+' сұрақ, ретімен бөлінген, ішінде араласады',()=>start(DATA.map((_,i)=>i).slice(a,b))]));
  items.push(['100 кездейсоқ сұрақ','Жылдам жаттығу',()=>start(shuffle(DATA.map((_,i)=>i)).slice(0,100))]);
  items.push(['50 кездейсоқ сұрақ','Қысқа тест',()=>start(shuffle(DATA.map((_,i)=>i)).slice(0,50))]);
  items.push(['25 кездейсоқ сұрақ','Өте жылдам',()=>start(shuffle(DATA.map((_,i)=>i)).slice(0,25))]);
  if(wrong.length)items.push(['Қателерді қайталау','Қателескен '+wrong.length+' сұрақ',()=>start(wrong.slice())]);
  const box=$('menuBtns');box.innerHTML='';
  items.forEach(([t,d,f])=>{const b=document.createElement('button');b.type='button';b.innerHTML='<b></b><span></span>';b.firstChild.textContent=t;b.lastChild.textContent=d;b.onclick=f;box.appendChild(b)});
  show('menu');
}
function start(ids){
  S={order:shuffle(ids),pos:0,right:0,miss:[],answered:false};
  store.set('dq_state',S);render();show('quiz');
}
function render(){
  if(S.pos>=S.order.length)return end();
  const item=DATA[S.order[S.pos]];
  $('pos').textContent='Сұрақ '+(S.pos+1)+' / '+S.order.length;
  $('score').textContent='Дұрыс: '+S.right;
  $('fill').style.width=(S.pos/S.order.length*100)+'%';
  $('qtext').textContent=item.q;
  $('next').classList.add('hide');
  $('next').textContent=S.pos+1>=S.order.length?'Нәтижені көру':'Келесі';
  const box=$('opts');box.innerHTML='';
  shuffle(item.o).forEach((t,i)=>{
    const b=document.createElement('button');b.type='button';b.className='opt';
    b.innerHTML='<span class="l"></span><span class="t"></span>';
    b.firstChild.textContent='ABCDE'[i];b.lastChild.textContent=t;
    b.onclick=()=>pick(b,t,item);box.appendChild(b);
  });
}
function pick(btn,t,item){
  if(S.answered)return;S.answered=true;
  const ok=t===item.o[0];
  [...$('opts').children].forEach(b=>{b.disabled=true;if(b.lastChild.textContent===item.o[0])b.classList.add('ok')});
  if(ok)S.right++;else{btn.classList.add('no');S.miss.push({i:S.order[S.pos],c:t})}
  $('score').textContent='Дұрыс: '+S.right;
  $('next').classList.remove('hide');
  store.set('dq_state',Object.assign({},S,{pos:S.pos+1,answered:false}));
}
$('next').onclick=()=>{S.pos++;S.answered=false;store.set('dq_state',S);render()};
let finTimer=0;
$('finish').onclick=()=>{
  const b=$('finish');
  if(b.dataset.arm){clearTimeout(finTimer);delete b.dataset.arm;b.textContent='Аяқтау';end();return}
  b.dataset.arm='1';b.textContent='Иә, аяқтау';
  finTimer=setTimeout(()=>{delete b.dataset.arm;b.textContent='Аяқтау'},4000);
};
$('tomenu').onclick=()=>{store.set('dq_state',S.answered?Object.assign({},S,{pos:S.pos+1,answered:false}):S);menu()};
function end(){
  const done=S.pos+(S.answered?1:0);
  const total=S.order.length;
  const pct=done?Math.round(S.right/done*100):0;
  const prev=store.get('dq_wrong')||[];
  const answeredIds=new Set(S.order.slice(0,done));
  const stillWrong=new Set(prev.filter(i=>!answeredIds.has(i)));
  S.miss.forEach(m=>stillWrong.add(m.i));
  store.set('dq_wrong',[...stillWrong]);
  store.set('dq_state',null);
  const r=$('result');
  r.innerHTML='<div class="card"><div class="sub" style="margin:0">Нәтиже</div><div class="big"></div><div id="det"></div><div class="row"><button class="primary" id="again" type="button">Басты мәзір</button><button class="ghost hide" id="redo" type="button">Қателерді қайталау</button></div></div><div class="card hide" id="mc"><b>Қателер</b><div id="ml"></div></div>';
  r.querySelector('.big').textContent=pct+'%';
  $('det').textContent=done+' сұрақтың '+S.right+'-і дұрыс'+(done<total?' ('+total+' сұрақтан '+done+' өтілді)':'')+'.';
  $('again').onclick=menu;
  if(S.miss.length){
    $('redo').classList.remove('hide');
    $('redo').onclick=()=>start(S.miss.map(m=>m.i));
    $('mc').classList.remove('hide');
    const ml=$('ml');
    S.miss.forEach(m=>{
      const d=document.createElement('div');d.className='rev';
      const q=document.createElement('div');q.textContent=DATA[m.i].q;q.style.fontWeight='600';
      const w=document.createElement('div');w.className='w';w.textContent='Сіздің жауап: '+m.c;
      const a=document.createElement('div');a.className='a';a.textContent='Дұрыс жауап: '+DATA[m.i].o[0];
      d.append(q,w,a);ml.appendChild(d);
    });
  }
  show('result');
}
$('theme').onclick=()=>{
  const el=document.documentElement,cur=el.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const n=cur==='dark'?'light':'dark';el.setAttribute('data-theme',n);store.set('dq_theme',n);
};
const th=store.get('dq_theme');if(th)document.documentElement.setAttribute('data-theme',th);
menu();
</script>
</body>
</html>
